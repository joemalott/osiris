# Osiris campaign mission data.
#
# Facts extracted from the Akhenaten reference reimplementation (AGPL; used here only as a
# source of facts, no code copied): /Users/jmalott/Desktop/Projects/pharaoh/Akhenaten
# /src/scripts/mission/m_NNN_*.js (and helpers missions.js, mission_favour_events.js).
# Scenario ids 0..52 are the campaign missions from PharaohData/mission1.pak, in the order
# listed by PharaohData/campaign.txt [MISSION_NAMES] (mission id == scenario id == file number).
# Non-campaign scripted maps (m_128_alexandria.js .. m_135_enkomi.js: custom/sandbox/multiplayer
# maps, not part of the id 0..52 campaign) are out of scope for this file.
#
# See MISSIONS_NOTES.md in this directory for: the full `unlocks[].when` condition vocabulary,
# how mission scripting works in the source engine (tutorial fire/collapse handling, goal
# tooltips, the Pharaoh-favour request/invasion chains that are NOT modeled here), and notes on
# fields intentionally omitted (map geometry, empire/trade-route/city data, scripted
# environmental `events[]` timelines) because they are out of scope for sim rules data.
#
# Schema (per [[mission]]):
#   id          = scenario id (0..52)
#   key         = "m_NNN_slug" (matches the Akhenaten source filename, minus .js)
#   name        = selection_title from the source script
#   buildings   = [building_key, ...]  buildings.toml keys available at mission start (the
#                 source script's top-level `buildings [...]` list; BUILDING_HOUSE_VACANT_LOT is
#                 an alias for BUILDING_HOUSE_CRUDE_HUT in the source engine and is mapped to
#                 "house_crude_hut" here; BUILDING_CLEAR_LAND (id 9) is a terrain tool with no
#                 buildings.toml entry and is omitted — see MISSIONS_NOTES.md).
#   funds       = { initial_funds = [5 ints, very_easy..impossible], rescue_loans = [5 ints],
#                   house_tax_multipliers = [5 ints]?, debt_interest = [5 ints]?,
#                   player_rank = int, religion_enabled = bool?, hide_won_screen = bool?,
#                   enable_scenario_events = bool?, start_message = "key"? }
#   env         = { has_animals, gods_least_mood, hide_nilometer, flotsam_enabled, ... }
#                 scalars as present in the source `env {}` block (default_marshland_grow /
#                 default_tree_grow references are shared engine defaults, not per-mission
#                 scalars, and are omitted).
#   win         = { population, culture, prosperity, housing_count, monuments, kingdom =
#                   { enabled, goal }; housing_level = { enabled, goal } (goal is an int house
#                   level, or a buildings.toml house key when the source used a BUILDING_HOUSE_*
#                   constant); survival_time, time_limit = { enabled, years };
#                   milestones = { p25, p50, p75 }? (source milestoneNN_year fields) }
#                 only present when the source script sets win_criteria (all missions do).
#   vars        = { name = value, ... } scalar values from the source `vars {}` block
#                 (booleans/ints only; the `goal_tooltip` function is UI text logic, omitted).
#   unlocks     = [ { when = "<condition>", enable = ["building_key", ...], advisors = [...]?,
#                     message = "message_key"? }, ... ] — progressive/tutorial building & advisor
#                 gating the source script implements via city.use_building(...)/
#                 set_advisor_available(...) in its event handlers. Most missions place their
#                 whole roster in `buildings` at start and gate nothing further, so `unlocks` is
#                 omitted for them (see MISSIONS_NOTES.md for which missions do gate).
#   messages    = [ { key = "message_key", trigger = "short description" }, ... ] popups the
#                 script shows (ui.popup_message / start_message), independent of unlocks.
#   notes       = "..."? free text for logic that doesn't fit the condition vocabulary (e.g. the
#                 recurring Pharaoh-favour resource-request / invasion chains many missions run,
#                 which affect reputation/trade but do not gate buildings and are not modeled
#                 here).
#
# `unlocks[].when` condition vocabulary — see MISSIONS_NOTES.md for full documentation:
#   "start"                              - unconditional, applied in the event_mission_start handler
#   "population >= N"                    - event_population_changed / event_migration_update, ev.value >= N
#   "resource_stored:<resource> >= N"    - granary/storage-yard amount reaches N (event_granary_resource_added
#                                           / event_warehouse_filled); <resource> is the lowercase RESOURCE_ name
#   "building_built:<building_key>"      - event_building_create, or event_advance_day polling
#                                           count_active_buildings()/count_total_buildings() > 0
#   "gold_delivered >= N"                - city.finance.this_year.income.gold_delivered reaches N this year
#   "fire"                               - event_fire_damage (first fire)
#   "collapse"                           - event_collase_damage (first building collapse; sic, source event name)
#   "disease"                            - event_city_disease (first disease outbreak)

[[mission]]
id = 0
key = "m_000_nubt"
name = "Nubt"
buildings = ["house_crude_hut", "road"]
# BUILDING_CLEAR_LAND has no buildings.toml key (terrain tool, id 9); omitted from the list above.

[mission.funds]
initial_funds = [7500, 5000, 3750, 2500, 2000]
rescue_loans = [7500, 5000, 3750, 2500, 2000]
house_tax_multipliers = [300, 200, 150, 100, 75]
player_rank = 0
religion_enabled = false
hide_won_screen = true
start_message = "message_housing_and_roads"

[mission.env]
has_animals = true
gods_least_mood = 50
hide_nilometer = true

[mission.win.housing_count]
enabled = true
goal = 6

[mission.win.housing_level]
enabled = true
goal = 2

[mission.vars]
granary_open_population = 150
granary_meat_stored = 400
victory_last_action_delay = 4
population_cap = 250
tutorial_fire_handled = false
tutorial_collapsed_handled = false
tutorial_firehouse_built = false
tutorial_granary_opened = false
tutorial_gamemeat_stored = false
granary_built = false
last_action_time = 0
start_message_shown = false

# Tutorial mission: the roster above is deliberately minimal. Every other building is gated off
# at start via city.use_building(X, false) and switched on as the player clears each tutorial
# beat. See MISSIONS_NOTES.md "Tutorial missions 0 and 1" for the full fire/collapse mechanic.
[[mission.unlocks]]
when = "start"
enable = []
notes = "At event_mission_start: hunting_lodge, granary, bazaar, water_supply, firehouse, architect_post start disabled (use_building(X, false)) and only turn on via the beats below. All non-diplomacy advisors are hidden at start (set_advisor_available loop 0..ADVISOR_DIPLOMACY)."

[[mission.unlocks]]
when = "fire"
enable = ["firehouse"]
message = "message_fire_in_the_village"

[[mission.unlocks]]
when = "collapse"
enable = ["architect_post"]
message = "message_tutorial_collapsed_building"

[[mission.unlocks]]
when = "population >= 150"
enable = ["hunting_lodge", "granary", "bazaar"]
advisors = ["ADVISOR_POPULATION"]
message = "message_tutorial_food_or_famine"
notes = "Gated on ev.value (population) >= mission.granary_open_population (150), from event_population_changed."

[[mission.unlocks]]
when = "resource_stored:gamemeat >= 400"
enable = ["water_supply"]
message = "message_tutorial_clean_water"
notes = "Granary gamemeat amount >= mission.granary_meat_stored (400), from event_granary_resource_added."

[[mission.messages]]
key = "message_housing_and_roads"
trigger = "start"

[[mission.messages]]
key = "message_fire_in_the_village"
trigger = "fire"

[[mission.messages]]
key = "message_tutorial_collapsed_building"
trigger = "collapse"

[[mission.messages]]
key = "message_tutorial_food_or_famine"
trigger = "population >= 150"

[[mission.messages]]
key = "message_tutorial_clean_water"
trigger = "resource_stored:gamemeat >= 400"

