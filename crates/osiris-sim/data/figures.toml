# Walker/figure type data for Osiris, extracted from the Akhenaten reference reimplementation
# (github reference: dalerank/Akhenaten, AGPL, used here as a source of facts only).
# Schema: id = original e_figure_type id; key = snake_case name;
# anims = { <name> = { pack, group, offset, frames?, duration?, loop? }, ... } (walk/death/etc,
# offset resolved from FIGURE_x self-reference constants where used, e.g. big_image);
# category/permission = simplified enum keys; text_id/help = meta text id and help link;
# remaining scalar params (speed_mult, max_roam_length, max_damage, terrain_usage, ...) kept as-is.
# The roaming walkers' max_roam_length is checked against the original's walker actions
# (water carrier 384; magistrate 640; juggler, senet player and zookeeper 512).

