"@PLeft-click a build button, then click or drag on the map to build. Right-click cancels the tool, closes windows, and drags to scroll. The arrow keys scroll the map and the mouse wheel zooms.@PP pauses. [ and ] (or Page Up and Page Down) change the speed, from 10% up to 200 times normal. - opens the Overseer of the Treasury and = the Chief Overseer.@PW, F and D show the water, fire and damage overlays; the Overlays menu has the rest. Space switches between the normal view and the last overlay.@PB builds roads and X clears land. M, N, U, O, T and G pick up a bazaar, granary, storage yard, apothecary, water supply and gardens; Ctrl+H housing, Ctrl+F firehouse and Ctrl+A architect.@PF11 or Alt+Enter switches between full screen and a window. F2 opens the game rules, F5 saves and F9 loads the saved game for this city; the city is also saved each month while Autosave is on (Options menu), and Continue on the main menu picks up the latest save. Escape backs out of whatever is open, and when nothing is, asks whether to leave for the main menu." = "@PCliquez sur un bouton de construction, puis cliquez ou faites glisser sur la carte pour bâtir. Le clic droit abandonne l'outil, ferme les fenêtres et, en glissant, fait défiler la carte. Les flèches font défiler la carte et la molette zoome.@PP met en pause. [ et ] (ou Page préc. et Page suiv.) changent la vitesse, de 10% jusqu'à 200 fois la normale. - ouvre l'Intendant du trésor et = l'Intendant en chef.@PW, F et D montrent l'eau, les risques d'incendie et les dégâts ; le menu Vues offre les autres. La barre d'espace passe de la vue normale à la dernière vue choisie.@PB construit des routes et X dégage le terrain. M, N, U, O, T et G prennent un bazar, un grenier, un entrepôt, un apothicaire, un point d'eau et des jardins ; Ctrl+H l'habitat, Ctrl+F la caserne de pompiers et Ctrl+A l'architecte.@PF11 ou Alt+Entrée passe du plein écran à une fenêtre. F2 ouvre les règles du jeu, F5 sauvegarde et F9 charge la partie de cette ville ; tant que la sauvegarde automatique est active (menu Options), la ville est aussi sauvegardée chaque mois, et Continuer, au menu principal, reprend la dernière sauvegarde. Échap referme ce qui est ouvert et, si rien ne l'est, demande si vous voulez revenir au menu principal."
"@POsiris is an open-source engine for Pharaoh, written in Rust and released under the GNU GPL version 3.@PIt plays the original campaign using your own copy of the game data. Pharaoh and its art, music and text are the work of Impressions Games and Sierra." = "@POsiris est un moteur libre pour Pharaon, écrit en Rust et publié sous la licence GNU GPL version 3.@PIl joue la campagne d'origine avec les données de votre propre exemplaire du jeu. Pharaon, ses graphismes, sa musique et ses textes sont l'œuvre d'Impressions Games et de Sierra."

