"@PLeft-click a build button, then click or drag on the map to build. Right-click cancels the tool, closes windows, and drags to scroll. The arrow keys scroll the map and the mouse wheel zooms.@PP pauses. [ and ] (or Page Up and Page Down) change the speed, from 10% up to 200 times normal. - opens the Overseer of the Treasury and = the Chief Overseer.@PW, F and D show the water, fire and damage overlays; the Overlays menu has the rest. Space switches between the normal view and the last overlay.@PB builds roads and X clears land. M, N, U, O, T and G pick up a bazaar, granary, storage yard, apothecary, water supply and gardens; Ctrl+H housing, Ctrl+F firehouse and Ctrl+A architect.@PF11 or Alt+Enter switches between full screen and a window. F2 opens the game rules, F5 saves and F9 loads the saved game for this city; the city is also saved each month while Autosave is on (Options menu), and Continue on the main menu picks up the latest save. Escape backs out of whatever is open, and when nothing is, asks whether to leave for the main menu." = "@PHaga clic en un botón de construcción y luego haga clic o arrastre sobre el mapa para construir. El clic derecho suelta la herramienta, cierra las ventanas y, arrastrando, desplaza el mapa. Las flechas desplazan el mapa y la rueda del ratón acerca y aleja.@PP pone la pausa. [ y ] (o Re Pág y Av Pág) cambian la velocidad, desde el 10% hasta 200 veces la normal. - abre el Supervisor del tesoro y = el Supervisor jefe.@PW, F y D muestran el agua, el riesgo de incendio y los daños; el menú Vistas tiene las demás. La barra espaciadora alterna entre la vista normal y la última vista elegida.@PB construye caminos y X despeja el terreno. M, N, U, O, T y G toman un bazar, un granero, un almacén, un boticario, un suministro de agua y jardines; Ctrl+H viviendas, Ctrl+F parque de bomberos y Ctrl+A arquitecto.@PF11 o Alt+Intro alterna entre pantalla completa y ventana. F2 abre las reglas del juego, F5 guarda y F9 carga la partida de esta ciudad; mientras el guardado automático está activado (menú Opciones), la ciudad también se guarda cada mes, y Continuar, en el menú principal, retoma la última partida guardada. Esc cierra lo que esté abierto y, si no hay nada, pregunta si desea volver al menú principal."
"@POsiris is an open-source engine for Pharaoh, written in Rust and released under the GNU GPL version 3.@PIt plays the original campaign using your own copy of the game data. Pharaoh and its art, music and text are the work of Impressions Games and Sierra." = "@POsiris es un motor libre para Faraón, escrito en Rust y publicado bajo la licencia GNU GPL versión 3.@PJuega la campaña original con los datos de su propia copia del juego. Faraón, sus gráficos, su música y sus textos son obra de Impressions Games y Sierra."

