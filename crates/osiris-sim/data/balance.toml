# akhenaten-only / explicitly a placeholder: scripts/city/monuments.js:54-67 code
# comment: "Rating is APPROXIMATE and additive... weights stay placeholders...
# Exact per-type OG points still need a .pak dump." Do not treat as verified original formula.
formula = "clamp(2.25 * sum(weight * phase_progress_pct) + 4.5, 0, 100)"
weight_examples = { pyramid = 44, sphinx = 1, mastaba = 2.5 }

[ratings.kingdom]
# city_kingdome_relations.cpp - discrete event-driven adjustments to a 0-100 rating,
# not one aggregate formula. Not cross-checked in Ghidra; no comment flags these as
# new, so probably faithful but unverified.
salary_mismatch_penalty_formula = "too-high salary: rating -= (rank_delta + 1); too-low salary: rating += 1"
# consecutive years of unpaid tribute
tribute_unpaid_penalty_by_consecutive_years = [-3, -3, -5, -8, -8]
debt_first_bailout_prosperity_penalty = -3
debt_second_time_kingdom_penalty = -5
debt_third_time_12mo_kingdom_penalty = -10
debt_third_time_24mo_rating_cap = 10
# deben-scaled gift sizes: modest/generous/lavish, by nth gift given (cooldown 12 months)
gift_relation_gain_by_attempt = [[3, 5, 10], [1, 3, 5], [0, 1, 3], [0, 0, 1]]
gift_cooldown_months = 12
defeat_invasion_bonus = { rating_lt = 35, bonus = 10 }
caesar_invasion_trigger_rating_le = 10
caesar_invasion_troop_sizes = [32, 64, 96, 144]
salary_rank_deben_per_month = [0, 2, 5, 8, 12, 20, 30, 40, 60, 80, 100]

# ---------------------------------------------------------------------------
# ENTERTAINMENT VENUES
# ---------------------------------------------------------------------------

[entertainment.coverage]
# city/coverage.cpp:97-104. Ghidra-VERIFIED for booth/bandstand/pavilion/zoo:
# FUN_00468170 (same function as [religion.coverage]) contains the identical
# constants 400, 700, 0x4b0(1200), 0x1d4c(7500) in the same order.
# population_covered_per_active_venue:
booth = 400
bandstand = 700
pavilion = 1200
zoo = 7500
# DIVERGENCE FOUND: Akhenaten treats any active senet house as flat 100% coverage
# (coverage.cpp:103), but Ghidra's FUN_00468170 computes a 5th value as
# population * 5000 (a per-population divisor, like the other venues), not a binary
# flag. This looks like a genuine Akhenaten behavior change from the original -
# consider using 5000 (matching the other venues' pattern) instead of a binary flag
# for a faithful reimplementation. akhenaten-only (divergence).
senet_house_akhenaten = "binary_100pct_if_any_active"
senet_house_ghidra_original = 5000
average_coverage_formula = "mean of the 5 venue coverage percentages"   # coverage.cpp:123-124

