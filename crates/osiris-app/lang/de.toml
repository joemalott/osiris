"@PLeft-click a build button, then click or drag on the map to build. Right-click cancels the tool, closes windows, and drags to scroll. The arrow keys scroll the map and the mouse wheel zooms.@PP pauses. [ and ] (or Page Up and Page Down) change the speed, from 10% up to 200 times normal. - opens the Overseer of the Treasury and = the Chief Overseer.@PW, F and D show the water, fire and damage overlays; the Overlays menu has the rest. Space switches between the normal view and the last overlay. Tab goes to the next building that is not working: no road, no workers or short of goods.@PB builds roads and X clears land. M, N, U, O, T and G pick up a bazaar, granary, storage yard, apothecary, water supply and gardens; Ctrl+H housing, Ctrl+F firehouse and Ctrl+A architect.@PF11 or Alt+Enter switches between full screen and a window. F2 opens the game rules, F5 saves and F9 loads the saved game for this city; the city is also saved each month while Autosave is on (Options menu), and Continue on the main menu picks up the latest save. Escape backs out of whatever is open, and when nothing is, asks whether to leave for the main menu." = "@PKlickt links auf eine Bauschaltfläche und dann auf die Karte, oder zieht mit der Maus, um zu bauen. Ein Rechtsklick legt das Werkzeug ab, schließt Fenster und verschiebt die Karte beim Ziehen. Die Pfeiltasten verschieben die Karte, das Mausrad zoomt.@PP hält das Spiel an. [ und ] (oder Bild auf und Bild ab) ändern das Tempo, von 10% bis zum Zweihundertfachen. - öffnet den Aufseher der Schatzkammer und = den Obersten Aufseher.@PW, F und D zeigen Wasser, Feuer und Schäden; das Menü Ansichten hat die übrigen. Die Leertaste wechselt zwischen der normalen Ansicht und der zuletzt gewählten. Mit Tab geht es zum nächsten Gebäude, das nicht arbeitet: ohne Straße, ohne Arbeiter oder mit Warenmangel.@PB baut Straßen und X räumt Land. M, N, U, O, T und G nehmen Basar, Kornspeicher, Lagerhof, Apotheke, Wasserversorgung und Gärten auf; Strg+H Wohnhaus, Strg+F Feuerwache und Strg+A Architekt.@PF11 oder Alt+Eingabe wechselt zwischen Vollbild und Fenster. F2 öffnet die Spielregeln, F5 speichert und F9 lädt den Spielstand dieser Stadt; solange Autospeichern an ist (Menü Optionen), wird die Stadt auch jeden Monat gespeichert, und Fortsetzen im Hauptmenü nimmt den neuesten Spielstand auf. Escape verlässt, was gerade offen ist, und fragt, wenn nichts offen ist, ob Ihr zum Hauptmenü zurückkehren wollt."
"@POsiris is an open-source engine for Pharaoh, written in Rust and released under the GNU GPL version 3.@PIt plays the original campaign using your own copy of the game data. Pharaoh and its art, music and text are the work of Impressions Games and Sierra." = "@POsiris ist eine quelloffene Engine für Pharao, in Rust geschrieben und unter der GNU GPL Version 3 veröffentlicht.@PSie spielt den ursprünglichen Feldzug mit den Spieldaten Eurer eigenen Kopie. Pharao mit seiner Grafik, seiner Musik und seinen Texten ist das Werk von Impressions Games und Sierra."

