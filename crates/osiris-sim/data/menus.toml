# Sidebar build-menu structure for Osiris, transcribed from Akhenaten's
# src/scripts/building_menu.js (var building_menu = [ ... ]), in original menu order.
# key = menu group key (from BUILDING_MENU_x, lowercased, without the BUILDING_MENU_ prefix).
# icon = { pack, group, offset } icon sprite shown on the sidebar category button.
# items = ordered list of building keys (see buildings.toml) or nested menu keys
# (prefixed 'menu_', referring to another [[menu]] key in this file) as they appear
# in-game. Two entries share key 'large_temples' in the source (one is a dead stub
# with empty items) -- both are kept here for fidelity.

