# Building type data for Osiris.
# Schema: id = original e_building_type id; key = snake_case name; size = footprint tiles;
# labor = labor category key; figure = walker figure key spawned by this building (if any);
# image = { pack, group, offset, frames?, x?, y? } base/normal sprite;
# anims = { <name> = { pack, group, offset, frames?, x?, y?, duration?, loop? }, ... };
# needs/flags = list of placement-need / config-flag keys set true;
# inputs/outputs = resource keys consumed/produced; text_id/help = meta text id and help link.
# Houses (id 10..29) additionally carry variants / variants_merged image tables.

