# City ambience map for Osiris: which looping WAV/MP3 under PharaohData/AUDIO plays for
# each building type that is currently on screen.
#
# Facts sourced from the Akhenaten reimplementation (read-only, facts only):
#   - Akhenaten src/scripts/city/sounds.js: the explicit channel -> file table
#     (`city_sounds` array), the ground truth for which asset backs each ambience channel.
#   - Akhenaten src/sound/sound_city.cpp (`building_type_to_channel`): which
#     building types share a channel, most notably the five house-tier channels
#     (SOUND_CHANNEL_CITY_HOUSE_SLUM/POOR/MEDIUM/GOOD/POSH).
#   - `id` below is osiris-sim's `crates/osiris-sim/data/buildings.toml` building id; `key` is
#     that same file's snake_case building key, kept here only for readability.
#   - `file` is relative to PharaohData/AUDIO/ (i.e. resolved as AUDIO/<file>).
#
# House tiers: the original switch statement lists 19 house building types across 5 tiers
# (4/4/4/4/3). osiris-sim's buildings.toml has 20 house ids (10..29); the 20th id
# (26, house_elegant_manor) has no unambiguous match in the switch statement excerpt available,
# so it is assigned to the HOUSE_POSH tier by even split (4/4/4/4/4) rather than guessed
# individually. This is a documented simplification, not a verified fact.
#
# `dentist` (id 49) and `physician` (id 206) are Akhenaten-only buildings added beyond the
# original 1999 Pharaoh roster; PharaohData ships no dedicated ambience WAV for them.
# `physician` reuses the apothecary channel's file (both are "doctor" health buildings in
# Akhenaten's own channel list) since Akhenaten defines a PHYSICIAN channel pointing at a
# `physician.wav` that does not exist in the original data; `dentist` has no reasonable
# original-asset substitute and is left out entirely (no ambience for it).

