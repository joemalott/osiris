"@PLeft-click a build button, then click or drag on the map to build. Right-click cancels the tool, closes windows, and drags to scroll. The arrow keys scroll the map and the mouse wheel zooms.@PP pauses. [ and ] (or Page Up and Page Down) change the speed, from 10% up to 200 times normal. - opens the Overseer of the Treasury and = the Chief Overseer.@PW, F and D show the water, fire and damage overlays; the Overlays menu has the rest. Space switches between the normal view and the last overlay.@PB builds roads and X clears land. M, N, U, O, T and G pick up a bazaar, granary, storage yard, apothecary, water supply and gardens; Ctrl+H housing, Ctrl+F firehouse and Ctrl+A architect.@PF11 or Alt+Enter switches between full screen and a window. F2 opens the game rules, F5 saves and F9 loads the saved game for this city; the city is also saved each month while Autosave is on (Options menu), and Continue on the main menu picks up the latest save. Escape backs out of whatever is open, and when nothing is, asks whether to leave for the main menu." = "@PCliccate su un pulsante di costruzione, poi cliccate o trascinate sulla mappa per costruire. Il clic destro lascia lo strumento, chiude le finestre e, trascinando, fa scorrere la mappa. Le frecce fanno scorrere la mappa e la rotellina del mouse ingrandisce.@PP mette in pausa. [ e ] (o PagSu e PagGiù) cambiano la velocità, dal 10% fino a 200 volte il normale. - apre il Sovrintendente del tesoro e = il Sovrintendente capo.@PW, F e D mostrano l'acqua, il rischio d'incendio e i danni; il menu Viste ha le altre. La barra spaziatrice passa dalla vista normale all'ultima vista scelta.@PB costruisce strade e X sgombra il terreno. M, N, U, O, T e G prendono un bazar, un granaio, un magazzino, uno speziale, una fonte d'acqua e dei giardini; Ctrl+H le abitazioni, Ctrl+F i pompieri e Ctrl+A l'architetto.@PF11 o Alt+Invio passa dallo schermo intero alla finestra. F2 apre le regole del gioco, F5 salva e F9 carica la partita di questa città; finché il salvataggio automatico è attivo (menu Opzioni) la città viene salvata anche ogni mese, e Continua, nel menu principale, riprende l'ultimo salvataggio. Esc chiude ciò che è aperto e, se non c'è nulla, chiede se volete tornare al menu principale."
"@POsiris is an open-source engine for Pharaoh, written in Rust and released under the GNU GPL version 3.@PIt plays the original campaign using your own copy of the game data. Pharaoh and its art, music and text are the work of Impressions Games and Sierra." = "@POsiris è un motore libero per Faraone, scritto in Rust e pubblicato con la licenza GNU GPL versione 3.@PGioca la campagna originale con i dati della vostra copia del gioco. Faraone, la sua grafica, la sua musica e i suoi testi sono opera di Impressions Games e Sierra."

