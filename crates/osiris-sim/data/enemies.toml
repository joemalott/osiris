# Invading enemy army data for Osiris, cross-referenced from two sources:
#
#   1. PharaohData/Data/*.sg3 (ground truth), inspected with
#      `osiris-tools info PharaohData/Data <Pack>` for every pack listed below. Every group id
#      was cross-checked against the actual record count of that group
#      (walk/attack/bow_attack/swim/idle animations are 8-directional: records = frames * 8;
#      "death" animations are NOT directional: records = frames, taken directly). Discrepancies
#      between an earlier frame count and the sg3 group's real record count are marked
#      CORRECTED inline with the evidence (old value vs. actual record count).
#
#   2. PharaohData/Figure_model.txt, ALL ENEMIES section (rows 0-59, twelve 5-row blocks:
#      Infantry, Missile, Chariots, Warship, Transport) and ALL FIGURES rows 54-56 (Egyptian
#      Infantry/Archers/Chariots), 99 (Bedouin Infantry, unused/lang-only), 100-101 (Egyptian
#      Warships/Transport Ships). `stats_row` below is the 0-based row index of a nation's
#      5-row block within the ALL ENEMIES section, except where noted otherwise.
#
# enemy_ids = values of ScenarioInfo.enemy_id (crates/osiris-formats/src/scenario.rs) that
# select this nation for a scripted invasion. These equal the raw e_enemy_type enum value
# (0=Barbarian, 1=Assyrian, 2=Canaanite, 3=Egyptian, 4=Hittite, 5=Hyksos, 6=Kushite, 7=Libian,
# 8=Nubian, 9=Persian, 10=Phoenician, 11=Roman, 12=SeaPeople), confirmed by reading
# scenario.cpp (`iob->bind(BIND_SIGNATURE_INT16, &g_scenario.enemy_id)`, cast straight to
# e_enemy_type with no lookup table) and figure_type.h's enum block.
#
# group = pack image-group index (as printed by `osiris-tools info`), frames = frames per
# direction for walk/attack/swim/idle (8 directions), or total frames for death (1 direction).
# attack2 = a nation's secondary attack animation where present (chariots: a second swing
# pose reusing the same group in some packs; missile infantry: "dagger_attack", a melee
# fallback used when an archer is engaged at close range).
#
# [UNVERIFIED] items:
#   - mitani: enemies.js defines NO figure_mitani_* blocks and no enemy_mitani{} entry, and
#     e_enemy_type (0-12) has no Mitani value at all -- Mitani cannot be spawned as a scripted
#     invader, despite Mitani.sg3 existing on disk and Figure_model.txt carrying
#     a full ALL ENEMIES stats block (rows 15-19) for it. It appears to be diplomacy/text-only,
#     consistent with the original game (Mitani never appears as an invasion nation in vanilla
#     Pharaoh either). The group ids given here are INFERRED by analogy: Mitani.sg3's group
#     layout is byte-for-byte identical (same start offsets) to Assyrian.sg3's, strongly
#     suggesting a shared animation template, but this has not been confirmed against any
#     source -- treat as a guess, not a fact.
#   - barbarian: has no entry in text group 37 (no dedicated nation name) and no ALL ENEMIES
#     row; enemy_barbarian{} carries its own literal stat values (max_damage,
#     attack_value, etc.) directly in enemies.js rather than referencing Figure_model.txt.
#   - Several nations (Nubian, Phoenician, Persian) have a JS figure class name (e.g.
#     "axeman", "spearman") that doesn't match the Figure_model.txt row label for the same
#     stats block (e.g. "Spearmen", "Archers", "Swordsmen") -- flagged inline per nation.
#     These look like cosmetic naming drift between the two data sources, not a functional
#     mismatch; the group ids/stats_row are still correctly paired.
#   - Kushite/Libian/Nubian/Phoenician/Persian/Roman/SeaPeople all have chariot sprite groups
#     defined in enemies.js, but Figure_model.txt's ALL ENEMIES row for their Chariots slot is
#     "Blank" (all-zero stats), and enemy_<nation>.figure_types[2] is FIGURE_NONE (or, for
#     Persian, percentage_type3 = 0) -- i.e. vanilla balance never fields that chariot
#     contingent even though the art exists. Assyrian is the mirror case: its Warship stats
#     row is "Blank" even though a full warship sprite/animation set exists.

