# Builds Osiris for macOS, Windows and Linux on every push to main and publishes the
# results as the rolling "snapshot" pre-release. No game data is built or shipped.
name: snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  # A running build finishes; of those waiting, only the newest runs.
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Replace the snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete snapshot --yes --cleanup-tag || true
          gh release create snapshot artifacts/* \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Snapshot $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --notes "Automatic build of the latest commit on main (${{ github.sha }}). Unstable; expect bugs. You need your own copy of Pharaoh's game data: see the README."
