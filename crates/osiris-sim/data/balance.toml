dance_school = { size = 4, min_houses_coverage = 50, cost_tiers = [30, 50, 100, 150, 200], laborers = 10 }
conservatory = { size = 3, min_houses_coverage = 50, cost_tiers = [20, 50, 90, 150, 200], laborers = 8 }
booth = { size = 2, min_houses_coverage = 100, cost_tiers = [10, 20, 40, 80, 150], laborers = 8 }
bandstand = { size = 3, min_houses_coverage = 100, cost_tiers = [30, 50, 100, 150, 200], laborers = 12 }
pavilion = { size = 4, min_houses_coverage = 100, cost_tiers = [100, 200, 300, 500, 800], laborers = 20 }
senet_house = { size = 4, min_houses_coverage = 100, cost_tiers = [300, 400, 500, 700, 1000], laborers = 25 }
bullfight_school = { size = 2, cost_tiers = [50, 80, 100, 150, 200], laborers = 15 }

[entertainment.performers]
